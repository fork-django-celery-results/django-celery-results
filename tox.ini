[tox]
envlist =
    py37-django32

    flake8
    flakeplus
    apicheck
    pydocstyle
    cov
    integration

[travis:env]
DJANGO =
    3.2: django32

[testenv]
deps=
    -r{toxinidir}/requirements/default.txt
    -r{toxinidir}/requirements/test.txt
    -r{toxinidir}/requirements/test-ci.txt

    django32: -r{toxinidir}/requirements/test-django32.txt

    cov,integration: -r{toxinidir}/requirements/test-django.txt

    linkcheck,apicheck: -r{toxinidir}/requirements/docs.txt
    flake8,flakeplus,pydocstyle: -r{toxinidir}/requirements/pkgutils.txt
sitepackages = False
recreate = True
commands =
    pip install -U celery==4.4.7
    pip install -U kombu==4.6.11
    pip install -U importlib_metadata==4.12.0
    pytest -xvs -k "not test_store_result"

[testenv:apicheck]
commands =
    sphinx-build -W -b apicheck -d {envtmpdir}/doctrees docs docs/_build/apicheck

[testenv:linkcheck]
commands =
    sphinx-build -W -b linkcheck -d {envtmpdir}/doctrees docs docs/_build/linkcheck

[testenv:flake8]
commands =
    flake8 {toxinidir}/django_celery_results {toxinidir}/t

[testenv:flakeplus]
commands =
    flakeplus --2.7 {toxinidir}/django_celery_results {toxinidir}/t

[testenv:pydocstyle]
commands =
    pydocstyle {toxinidir}/django_celery_results

[testenv:cov]
usedevelop = true
commands = pip install -U celery
           pip install -U kombu
           pytest --cov=django_celery_results --cov-report=xml --no-cov-on-fail

[testenv:integration]
commands =
    pip install -U celery
    pip install -U kombu
    pytest -B -xv